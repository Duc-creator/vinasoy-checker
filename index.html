<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>OCR Date Checker</title>

<style>
:root{ --w: 340px; --h: 240px; }
body{ font-family: system-ui; background:#f6f7f9; margin:0; }
.wrap{ max-width:720px; margin:auto; padding:14px; }

video{
  width: var(--w);
  height: var(--h);
  max-width: var(--w);
  max-height: var(--h);
  object-fit: cover;
  border-radius: 12px;
  border: 2px solid #e3e7ee;
  background:#000;
}

.camera{ position:relative; display:inline-block; }
#crossOverlay{ position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }

button{ padding:10px; border-radius:10px; background:#0a7cff; color:#fff; border:none; }
input,select{ padding:8px; border-radius:8px; border:1px solid #ccc; }

.status{ font-weight:bold; }
.ok{ color:green }
.fail{ color:red }
.warn{ color:orange }
</style>
</head>

<body>
<div class="wrap">

<h3>OCR Date Validator</h3>

<input id="weekday" readonly style="width:60px"/>

<label><input type="checkbox" id="singleLineCheck"/> 1 line</label>
<label><input type="checkbox" id="useCustomDate"/> chọn ngày</label>
<input type="date" id="mfgDate"/>

<br><br>

<button id="openBtn">Bật camera</button>
<button id="captureBtn">Scan</button>

<div class="camera">
  <video id="video" playsinline webkit-playsinline muted></video>
  <canvas id="crossOverlay"></canvas>
</div>

<div id="result" class="status">—</div>
<div id="ocrText"></div>

<canvas id="rawCanvas" style="display:none"></canvas>

</div>

<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<script>
const $ = s => document.querySelector(s);
const video = $('#video');
const crossOverlay = $('#crossOverlay');
const rawCanvas = $('#rawCanvas');

let worker=null;

/* ===== WEEKDAY ===== */
function calcWeekday(d){
  const day = d.getDay();
  return (day===0)?1:day+1;
}

function updateWeekday(){
  let d=new Date();
  if($('#useCustomDate').checked){
    const val=$('#mfgDate').value;
    if(val) d=new Date(val);
  }
  $('#weekday').value = calcWeekday(d);
}

updateWeekday();
$('#useCustomDate').addEventListener('change', updateWeekday);
$('#mfgDate').addEventListener('change', updateWeekday);

/* ===== CROSS ===== */
function drawCross(){
  const ctx=crossOverlay.getContext('2d');
  ctx.clearRect(0,0,crossOverlay.width,crossOverlay.height);
  const cx=crossOverlay.width/2;
  const cy=crossOverlay.height/2;
  ctx.strokeStyle='red';
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(cx-25,cy);
  ctx.lineTo(cx+25,cy);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx,cy-25);
  ctx.lineTo(cx,cy+25);
  ctx.stroke();
}

/* ===== CAMERA ===== */
async function openCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:640},
        height:{ideal:480}
      },
      audio:false
    });

    video.srcObject=stream;
    video.setAttribute('playsinline', true);
    video.setAttribute('webkit-playsinline', true);

    await video.play();

    video.style.width="340px";
    video.style.height="240px";

    crossOverlay.width=video.clientWidth;
    crossOverlay.height=video.clientHeight;

    rawCanvas.width=video.videoWidth;
    rawCanvas.height=video.videoHeight;

    drawCross();

  }catch(e){
    alert("Camera lỗi: "+e.message);
  }
}

$('#openBtn').addEventListener('click', openCamera);

/* ===== OCR ===== */
async function initOCR(){
  if(worker) return;
  worker = await Tesseract.createWorker();
  await worker.loadLanguage('eng');
  await worker.initialize('eng');
  await worker.setParameters({
    tessedit_char_whitelist:'0123456789ABCDEFGHI ',
    tessedit_pageseg_mode:'7'
  });
}

function preprocess(){
  const ctx=rawCanvas.getContext('2d');
  ctx.drawImage(video,0,0,rawCanvas.width,rawCanvas.height);

  let src=cv.imread(rawCanvas);
  let gray=new cv.Mat();
  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);

  let bin=new cv.Mat();
  cv.threshold(gray,bin,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);

  src.delete();
  gray.delete();

  return bin;
}

function cleanText(t){
  return t.replace(/\s+/g,' ').trim().toUpperCase().replace(/[^0-9A-I ]/g,'');
}

async function scan(){
  await initOCR();

  let mat = preprocess();

  let tmp=document.createElement('canvas');
  tmp.width=mat.cols;
  tmp.height=mat.rows;
  cv.imshow(tmp,mat);

  const {data:{text}} = await worker.recognize(tmp);

  mat.delete();
  tmp.remove();

  const cleaned = cleanText(text);

  $('#ocrText').textContent = cleaned;

  if(/^\d{2} \d{2} \d{2}/.test(cleaned)){
    $('#result').textContent="✅ OK";
    $('#result').className="status ok";
  }else{
    $('#result').textContent="❌ FAIL";
    $('#result').className="status fail";
  }
}

$('#captureBtn').addEventListener('click', scan);
</script>

</body>
</html>
